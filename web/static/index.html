<!doctype html>
<html lang="en">
<head>
<link rel="icon" href="/static/favicon.svg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bgsim — balance workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root{
    --felt:#1E4A38; --felt-deep:#16382B; --paper:#F7F5EF; --ink:#22271F;
    --ink-soft:#5A6156; --token:#D9A441; --alert:#A8482E; --ok:#2F6B4F;
    --rule:#D8D2C2;
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none!important} }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--felt); color:var(--ink);
    font:16px/1.55 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  }
  h1,h2,h3,.display{font-family:"Bricolage Grotesque", ui-sans-serif, sans-serif}
  header{
    display:flex; align-items:baseline; gap:14px;
    padding:22px 28px 10px; color:var(--paper);
  }
  header h1{margin:0; font-weight:800; font-size:26px; letter-spacing:.2px}
  header span{opacity:.75; font-size:14px}
  .table{display:grid; grid-template-columns:270px 1fr; gap:20px;
         padding:12px 28px 40px; max-width:1180px}
  @media (max-width:820px){ .table{grid-template-columns:1fr} }

  /* paper sheets on the felt */
  .sheet{background:var(--paper); border-radius:3px; padding:18px 20px;
         box-shadow:0 2px 0 var(--felt-deep);}
  .shelf .sheet{padding:14px 16px}
  .shelf h2{margin:2px 0 10px; font-size:15px; font-weight:600; color:var(--ink-soft)}
  .shelf button.project{
    display:block; width:100%; text-align:left; background:none; border:0;
    border-bottom:1px solid var(--rule); padding:9px 4px; cursor:pointer;
    font:inherit; color:var(--ink);
  }
  .shelf button.project:last-of-type{border-bottom:0}
  .shelf button.project.active{background:#EFEBDF; border-radius:3px}
  .shelf button.project .sub{display:block; font-size:12.5px; color:var(--ink-soft)}
  .shelf .new{margin-top:12px}

  label{display:block; font-size:13.5px; color:var(--ink-soft); margin:12px 0 3px}
  input[type=text], input[type=number], select, textarea{
    width:100%; font:inherit; color:var(--ink); background:#fff;
    border:1px solid var(--rule); border-radius:3px; padding:7px 9px;
  }
  textarea{min-height:130px; resize:vertical}
  :focus-visible{outline:2px solid var(--token); outline-offset:1px}

  /* chunky token buttons */
  .btn{
    font:600 15px/1 "Bricolage Grotesque", sans-serif; color:var(--paper);
    background:var(--felt); border:0; border-radius:8px; padding:11px 16px;
    cursor:pointer; box-shadow:0 2px 0 var(--felt-deep);
  }
  .btn:active{transform:translateY(1px); box-shadow:0 1px 0 var(--felt-deep)}
  .btn.amber{background:var(--token); color:var(--ink); box-shadow:0 2px 0 #A87B2A}
  .btn[disabled]{opacity:.45; cursor:progress; filter:grayscale(.6)}

  .status{font-size:14px; margin-top:10px}
  .status.err{color:var(--alert)}
  .status.ok{color:var(--ok)}
  .spin{display:inline-block; width:10px; height:10px; border-radius:50%;
        border:2px solid var(--ink-soft); border-top-color:transparent;
        animation:r 0.8s linear infinite; vertical-align:-1px; margin-right:6px}
  @keyframes r{to{transform:rotate(360deg)}}

  .runbar{display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end}
  .runbar > div{flex:1; min-width:120px}
  .runbar .go{flex:0}
  .seats{display:flex; gap:6px; flex-wrap:wrap}
  .seats select{width:auto; min-width:120px}
  label input[type=checkbox]{vertical-align:-1px; margin-right:5px}

  /* the score-pad report */
  .pad{margin-top:20px}
  .pad h2{margin:0 0 2px; font-size:22px; font-weight:800}
  .pad .meta{color:var(--ink-soft); font-size:13.5px; font-style:italic}
  .pad h3{margin:20px 0 6px; font-size:16px; font-weight:600;
          border-bottom:2px solid var(--ink); display:inline-block; padding-bottom:2px}
  .pad table{border-collapse:collapse; margin:6px 0 4px; width:auto; min-width:340px}
  .pad th{font-weight:600; font-size:13px; color:var(--ink-soft);
          text-align:left; padding:4px 14px 4px 0; border-bottom:1.5px solid var(--ink)}
  .pad td{padding:5px 14px 5px 0; border-bottom:1px solid var(--rule);
          font-variant-numeric:tabular-nums}
  .pad td:last-child{color:var(--ink); font-weight:600}
  .pad ul{margin:6px 0; padding-left:20px}
  .pad li{margin:3px 0}
  .empty{color:var(--ink-soft); font-size:15px}
  .stage{margin:12px 0; padding:10px 12px; background:#F1EEE4; border-radius:3px; font-size:14px}
  .rq{margin:8px 0 4px; padding:6px 0; border-top:1px dashed var(--rule)}
  .rq input{margin-top:4px}
  .kind{font-size:11px; padding:1px 6px; border-radius:3px; background:var(--felt); color:var(--paper)}
  .kind.missing{background:var(--alert)} .kind.contradiction{background:#7A2E1E}
  .answers{display:flex; flex-direction:column; gap:6px; margin:6px 0}
  .ans{text-align:left; font:inherit; font-size:14px; padding:9px 12px; border:1.5px solid var(--felt); border-radius:6px; background:#fff; color:var(--ink); cursor:pointer}
  .ans:hover{background:#EEF3EF} .ans .tag{display:block; font-size:12px; color:var(--ink-soft); margin-top:3px}
  .diff{font:11.5px/1.4 ui-monospace,Consolas,monospace; background:#1f2a24; color:#dfe6e1; padding:10px; border-radius:6px; max-height:420px; overflow:auto; white-space:pre}
  .dadd{color:#9be29b} .ddel{color:#ff9c9c} .dhunk{color:#8fc5ff}
  .logs{margin-top:18px; opacity:.85} .logs summary{cursor:pointer}
  .decide{margin-top:6px; font-size:13px} .decide summary{cursor:pointer; color:var(--ink-soft)}
  .resolve{margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-size:13px}
  .resolve .btn{padding:5px 9px; font-size:12.5px}
  .versions{font-size:13px; color:var(--ink-soft); margin:6px 0}
  .vrow{padding:3px 0 3px 12px}
  .inbox{border-left:4px solid var(--token)}
  .meter{height:8px; background:#DDD7C6; border-radius:4px; margin:6px 0 4px; overflow:hidden}
  .meter .fill{height:100%; background:var(--ok)}
  .src{font-size:12px; color:var(--ink-soft)}
  .ct{border-collapse:collapse; font-size:13px; margin:6px 0}
  .ct td{padding:3px 10px 3px 0; border-bottom:1px solid var(--rule)}
  .ct .basis{color:var(--ink-soft)} .ct tr.inferred td, li.inferred{background:#F6EBD9} .ct tr.unclear td, li.unclear{background:#F3DCD4}
  .asm{color:var(--alert)}
  .qual{margin-top:14px; border-top:1px solid var(--rule); padding-top:8px}
  .qual h3{margin:0 0 6px; font-size:15px}
  .qrow{display:flex; gap:8px; padding:5px 0; font-size:14px; border-bottom:1px dashed var(--rule)}
  .qrow.flag{background:#F6EBD9; margin:0 -6px; padding:6px 6px; border-radius:3px}
  .qi{width:16px; flex:none; text-align:center}
  .qrow.pass .qi{color:var(--ok)} .qrow.flag .qi{color:var(--alert)} .qrow.info .qi{color:var(--ink-soft)}
  .qq{margin-top:3px; color:var(--ink-soft); font-size:13px}
</style>
</head>
<body>
<header>
  <h1>bgsim</h1><span>put your rules on the table</span>
</header>
<div class="table">
  <aside class="shelf">
    <div class="sheet">
      <h2>Your games</h2>
      <div id="projects"></div>
      <div class="new"><button class="btn" onclick="showNew()">New game</button></div>
    </div>
  </aside>
  <main id="main"></main>
</div>

<script>
const $ = (s)=>document.querySelector(s);
let projects=[], current=null, DEV=false;
fetch('/api/config').then(r=>r.json()).then(c=>{DEV=!!c.dev; const f=document.getElementById('build'); if(f) f.textContent='running: '+c.build;}).catch(()=>{});

async function api(path, opts, method){
  const r = await fetch('/api'+path, (opts||method) && {method: method || 'POST',
    headers:{'content-type':'application/json'}, body: opts ? JSON.stringify(opts) : undefined});
  const data = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.detail || r.statusText);
  return data;
}

async function refresh(sel){
  projects = await api('/projects');
  const el = $('#projects'); el.innerHTML='';
  for(const p of projects){
    const b = document.createElement('button');
    b.className = 'project'+(current===p.id?' active':'');
    b.innerHTML = `${p.name}<span class="sub">${
      p.builtin ? 'built-in engine' :
      p.engine==='generated' ? 'engine ready' : 'no engine yet'}</span>`;
    b.onclick = ()=>open(p.id);
    el.appendChild(b);
  }
  if(sel) open(sel);
  else if(!projects.length) showNew();
}

function showNew(){
  current=null; refreshShelf();
  $('#main').innerHTML = `
  <div class="sheet">
    <h2 class="display" style="margin:0 0 4px">New game</h2>
    <p class="empty" style="margin-top:0">Paste a rulebook and bgsim builds the
    simulator, or start from a built-in engine to try the workbench.</p>
    <label for="nm">Name</label>
    <input type="text" id="nm" placeholder="My worker placement game">
    <label for="bi">Engine</label>
    <select id="bi">
      <option value="">Generate from my rulebook</option>
      <option value="splendor">Built-in: Splendor</option>
      <option value="agricola">Built-in: Agricola (Family Game)</option>
    </select>
    <div id="rbwrap">
      <label for="rb">Rulebook</label>
      <textarea id="rb" placeholder="Paste the full rules text here"></textarea>
      <details style="margin-top:10px"><summary style="cursor:pointer;color:var(--ink-soft)">Component tables (optional) — cards, tiles, anything with printed values your rules refer to but don't list</summary>
        <div id="comps"></div>
        <button class="btn" style="padding:4px 9px;font-size:12px;margin-top:6px" onclick="addCompRow()">+ add a table</button>
        <div class="qq">If you skip this, the review will tell you which tables it needs.</div>
      </details>
    </div>
    <p style="margin:14px 0 0"><button class="btn amber" onclick="createProject()">Add to the table</button></p>
    <p class="status err" id="newerr"></p>
  </div>`;
  $('#bi').onchange = e => $('#rbwrap').style.display = e.target.value ? 'none':'';
}

function refreshShelf(){
  document.querySelectorAll('.shelf .project').forEach(b=>b.classList.remove('active'));
}

function addCompRow(){
  const d = document.createElement('div'); d.className='comprow'; d.style.cssText='margin-top:8px';
  d.innerHTML = `<input type="text" class="cname" placeholder="What is this table? e.g. development cards" style="width:100%">
    <textarea class="ctext" rows="4" placeholder="Header row, then one row per item (CSV or tab-separated)" style="width:100%;margin-top:4px;font:12px ui-monospace,Consolas,monospace"></textarea>`;
  $('#comps').appendChild(d);
}
async function createProject(){
  try{
    const components = [...document.querySelectorAll('.comprow')].map(r=>({name:r.querySelector('.cname').value, text:r.querySelector('.ctext').value})).filter(c=>c.name.trim()&&c.text.trim());
    const p = await api('/projects', {name:$('#nm').value,
      builtin:$('#bi').value||null, rulebook:$('#rb')? $('#rb').value:'', components});
    refresh(p.id);
  }catch(e){ $('#newerr').textContent = e.message; }
}

async function open(id){
  current=id;
  const p = await api('/projects/'+id);
  refresh0(p);
}
function refresh0(p){
  refreshShelf();
  const canRun = p.builtin || p.engine==='generated';
  $('#main').innerHTML = `
  <div class="sheet">
    <h2 class="display" style="margin:0">${p.name} <button class="btn" style="padding:3px 9px;font-size:12px;background:var(--alert);vertical-align:middle" onclick="deleteProject('${p.id}','${esc(p.name).replace(/'/g,"\\'")}')">Delete game</button></h2>
    ${p.complexity ? `<p class="status">${p.complexity.tier==='heavy'?'Heavy game':'Light game'} (score ${p.complexity.score}: ${p.complexity.words.toLocaleString()} words, ${p.complexity.actions} actions) · model spend $${(p.spend_usd||0).toFixed(2)} of $${p.complexity.budget_usd.toFixed(0)} budget
      <button class="btn" style="padding:2px 7px;font-size:11px;margin-left:6px" onclick="setBudget('${p.id}',${p.complexity.budget_usd})">change</button></p>` : (p.spend_usd?`<p class="status">model spend $${p.spend_usd.toFixed(2)}</p>`:'')}
    <div id="running"></div>
    <p class="status" id="engstat">${
      p.builtin ? 'Engine: built-in '+p.builtin :
      p.engine==='generated' ? 'Engine: generated · '+(p.validation||'') :
      'No engine yet.'}${!p.builtin && p.engine==='generated' ? ` <button class="btn${p.needs_regeneration?' amber':''}" style="padding:3px 9px;font-size:12px;margin-left:8px" onclick="if(confirm('Rebuild the engine from the current rulebook (~$0.35)? The old engine is kept in Versions.')) generate('${p.id}', true, this)">${p.needs_regeneration?'Rules changed — rebuild the engine (~$0.35)':'Rebuild the engine (~$0.35)'}</button>`:''}</p>
    ${!p.builtin ? renderReview(p) : ''}
    ${!p.builtin ? renderInbox(p) : ''}
    ${!p.builtin && p.workshop && p.workshop.readiness===100 && !p.last_run ?
      `<p><button class="btn amber" onclick="runAll('${p.id}', this)">Run everything — build, audit, second opinion, jury, report (~$1.50)</button> <span class="status" style="display:inline">You can leave; questions wait in the inbox.</span></p>`:''}
    ${!p.builtin && p.engine!=='generated' ?
      `<p><button class="btn" onclick="generate('${p.id}', false, this)">Build just the engine</button></p>`:''}
    ${(p.builtin || p.engine==='generated') && !p.builtin ? renderCheckers(p) : ''}
    <div class="runbar" ${canRun?'':'style="opacity:.5;pointer-events:none"'}>
      <div><label for="g">Games</label><input id="g" type="number" value="500" min="1"></div>
      <div><label for="pl">Players</label><input id="pl" type="number" value="2" min="2" max="4" onchange="buildSeats()"></div>
      <div style="flex:2"><label>Who sits at the table</label>
        <div id="seats" class="seats"></div>
        <label style="margin-top:6px"><input type="checkbox" id="rot" checked> rotate seats between games (fair comparison)</label></div>
      <div class="go"><button class="btn amber" onclick="runSim('${p.id}', this)">Run the games</button></div>
    </div>
    <div id="quality"></div>
    ${renderLogs(p)}
    <p class="status" id="simstat"></p>
    <div class="pad" id="pad"></div>
  </div>`;
  window.__builtin = p.builtin; buildSeats(); renderQuality(p);
  showRunning(p.id);
  if(p.has_report) loadReport(p.id);
  else $('#pad').innerHTML = canRun ?
    '<p class="empty">No report yet. Run the games and the score pad fills in here.</p>' : '';
}

function buildSeats(){
  const n = Math.min(4, Math.max(2, +$('#pl').value || 2));
  $('#pl').value = n;
  const opts = [['scoregreedy','score-greedy'], ['random','random']];
  if(window.__builtin==='splendor') opts.unshift(['expert','expert (Splendor)']);
  const prev = [...document.querySelectorAll('#seats select')].map(s=>s.value);
  $('#seats').innerHTML = Array.from({length:n}, (_,i)=>
    `<select data-seat="${i}">${opts.map(([v,l])=>
      `<option value="${v}" ${(prev[i]||opts[0][0])===v?'selected':''}>${l}</option>`).join('')}</select>`
  ).join('');
}
function agentsString(){
  return [...document.querySelectorAll('#seats select')].map(s=>s.value).join(',');
}

function renderReview(p){ return renderWorkshop(p); }
function renderWorkshop(p){
  const ws = p.workshop;
  if(!ws) return `<div class="stage"><b>Rules workshop</b> — before anything is built, the model restates your rules, walks a sample round, and asks about every place it had to guess. This is the part that decides whether everything after it is worth anything.
    <p><button class="btn amber" onclick="runWorkshop('${p.id}', this)">Start the workshop (~$0.15)</button></p></div>`;
  const open = ws.items.filter(i=>i.status==='open');
  const shown = open.filter(i=>!i.deferred), deferred = open.filter(i=>i.deferred);
  const auto = ws.items.filter(i=>i.status==='auto').length;
  const meter = `<div class="meter"><div class="fill" style="width:${ws.readiness}%"></div></div>`;
  const kindLabel = k => ({inferred:'assumed', unclear:'not settled', missing:'missing', ambiguous:'ambiguous', contradiction:'contradiction', undefined:'undefined'}[k]||k);
  const itemHtml = i => `<div class="rq"><span class="kind ${i.kind}">${kindLabel(i.kind)}</span> <span class="src">${esc(i.source)}${i.where?' · '+esc(i.where):''}</span>
      <div>${esc(i.text)}</div>
      ${i.assumption?`<div class="qq">The model assumed: <i>${esc(i.assumption)}</i></div>`:''}
      ${i.quote?`<div class="qq">From your rules: "${esc(i.quote)}"</div>`:''}
      <div class="resolve">
        <span class="status" id="wss-${i.id}" style="margin:0;flex-basis:100%"></span>
        ${i.assumption?`<button class="btn" onclick="wsAnswer('${p.id}','${i.id}','',true)">That's right</button>`:''}
        <input type="text" id="ws-${i.id}" placeholder="${i.assumption?'or correct it in your words':'your answer'}" style="flex:1;min-width:180px">
        <button class="btn amber" onclick="wsAnswer('${p.id}','${i.id}',$('#ws-${i.id}').value,false)">Save</button>
        <button class="btn" onclick="wsSkip('${p.id}','${i.id}')">Not sure</button>
        <button class="btn" onclick="wsDismiss('${p.id}','${i.id}')" title="Settles it without adding anything to your rulebook">Not a rules question</button>
      </div></div>`;
  return `<div class="stage"><b>Rules workshop</b> — pass ${ws.pass} of ${5} · readiness <b>${ws.readiness}%</b>${meter}
    <div class="qq">${ws.items.length} places the model wasn't certain · ${auto} answered from your own text · ${ws.items.filter(i=>i.status==='confirmed'||i.status==='answered').length} settled by you · ${ws.items.filter(i=>i.status==='dismissed').length} not rules questions · ${open.length} open</div>
    ${shown.length ? shown.map(itemHtml).join('') : (open.length ? '' : '<p class="status ok">Nothing open. Your rules are ready.</p>')}
    ${deferred.length?`<details><summary>${deferred.length} set aside as "not sure"</summary>${deferred.map(itemHtml).join('')}</details>`:''}
    ${renderComponents(p, ws)}
    ${(()=>{ const done = ws.items.filter(i=>i.status==='confirmed'||i.status==='answered'||i.status==='dismissed'); return done.length?`<details><summary>${done.length} settled by you</summary>${done.map(i=>`<div class="qq">${esc(i.text)} → <b>${esc(i.answer)}</b> <button class="btn" style="padding:2px 7px;font-size:11px" onclick="wsUndo('${p.id}','${i.id}')">Undo</button></div>`).join('')}</details>`:''; })()}
    <details><summary>Cost table as the model reads it (${ws.cost_table.length} actions)</summary><table class="ct">${ws.cost_table.map(r=>`<tr class="${r.basis}"><td>${esc(r.action)}</td><td>${esc(r.cost)}</td><td>${esc(r.effect)}</td><td class="basis">${r.basis}</td></tr>`).join('')}</table></details>
    <details><summary>A sample round, as the model would play it</summary><ol>${ws.walk.map(s=>`<li>${esc(s.text)}${s.assumption?` <i class="asm">(assumed: ${esc(s.assumption)})</i>`:''}</li>`).join('')}</ol></details>
    <details><summary>Full outline (${ws.outline.reduce((n,s)=>n+s.lines.length,0)} lines — you don't need to read this)</summary>${ws.outline.map(s=>`<b>${esc(s.section)}</b><ul>${s.lines.map(l=>`<li class="${l.basis}">${esc(l.text)}</li>`).join('')}</ul>`).join('')}</details>
    ${(()=>{ const mine = (p.clarifications_store||[]).filter(r=>r.key.startsWith('designer:')); return mine.length ? `<details open><summary>Rules you added yourself (${mine.length})</summary>${mine.map(r=>`<div class="qq">${esc(r.answer)} <button class="btn" style="padding:2px 7px;font-size:11px" onclick="removeRule('${p.id}','${r.key}')">remove</button></div>`).join('')}</details>` : ''; })()}
    <div class="resolve">Add a rule the review didn't ask about: <input type="text" id="clar-${p.id}" placeholder="e.g. If every player passes in succession, the game ends and is scored." style="flex:1;min-width:260px"> <button class="btn amber" onclick="addClarification('${p.id}')">Add to my rulebook</button></div>
    <p>${ws.pass<5?`<button class="btn" onclick="runWorkshop('${p.id}', this)">Re-review with my answers (~$0.15)</button>`:(ws.readiness<100?'<span class="status err">All 5 passes used — remaining open items usually mean the rulebook needs an edit.</span>':'')}
    ${DEV && ws.pass>=5 ? `<button class="btn" style="padding:4px 8px;font-size:12px" onclick="wsResetPasses('${p.id}')">Reset passes (dev)</button>`:''}</p></div>`;
}
async function runWorkshop(id, btn){ await fromButton(btn, 'Workshop', ()=>api('/projects/'+id+'/workshop', {})); }
function wsBusy(item, on, msg){
  const st = document.getElementById('wss-'+item); if(!st) return;
  const box = st.closest('.item'); if(box) box.querySelectorAll('button,input').forEach(b=>b.disabled=on);
  st.className = 'status'; st.innerHTML = on ? `<span class="spin"></span>${msg||'Saving…'}` : '';
}
async function wsCall(id, item, path, payload){
  wsBusy(item, true);
  try{ await api('/projects/'+id+path, payload); open(id); }
  catch(e){ wsBusy(item, false); const st = document.getElementById('wss-'+item); if(st){ st.className='status err'; st.textContent=e.message; } else alert(e.message); }
}
async function wsAnswer(id, item, answer, confirm){ await wsCall(id, item, '/workshop/answer', {item_id:item, answer, confirm}); }
async function wsUndo(id, item){ await api('/projects/'+id+'/workshop/undo', {item_id:item}); open(id); }
async function inboxUndo(id, item){ const m = await api('/projects/'+id+'/inbox/undo', {item_id:item}); if(m.undo_note) alert(m.undo_note); open(id); }
async function removeRule(id, key){ await api('/projects/'+id+'/workshop/unclarify', {item_id:key}); open(id); }
async function addClarification(id){
  const el = document.getElementById('clar-'+id); const text = el.value;
  if(!text.trim()){ alert('Write the rule first.'); return; }
  try{ await api('/projects/'+id+'/workshop/clarify', {text}); open(id); }catch(e){ alert(e.message); }
}

async function findingAct(id, name, decision){
  if(BUSY){ alert('Something is already running on this game — wait for it to finish.'); return; }
  const st = document.getElementById('fs-'+name);
  const row = st ? st.closest('.qrow') : null;
  const busy = on => { if(row) row.querySelectorAll('button').forEach(b=>b.disabled=on); };
  let note = '';
  if(decision==='rulebook'){ note = prompt('Write the clarification in your own words — it gets added to your rulebook:'); if(note===null) return; }
  if(decision==='answer'){ note = document.getElementById('fs-'+name+'-ans').value; if(!note.trim()){ st.textContent='Type the answer first.'; return; } }
  busy(true); BUSY = true;
  try{
    if(decision==='jury'){
      const job = await api('/projects/'+id+'/jury', {}); await watch(job.id, st, 'Jury deliberating'); BUSY=false; open(id); return; }
    const r = await api('/projects/'+id+'/checkers/resolve', {name, decision, note});
    if(r.id && r.status){ await watch(r.id, st, /engine|auditor_right|answer/.test(decision)?'Fixing the simulation':'Working'); }
    else { st.className='status ok'; st.textContent = /auditor|sim_right/.test(decision) ? 'Auditor dismissed; your answer was added to the rulebook.' : 'Clarification added.'; }
    BUSY=false; open(id);
  }catch(e){ st.className='status err'; st.textContent=e.message; busy(false); BUSY=false; }
}

  const icon = s => s==='pass' ? '&#10003;' : s==='flag' ? '&#9888;' : '&#8226;';
  const so = p.second_opinion;
  const staleQ = p.quality_stale ? `<div class="qq" style="background:#F6E7C1;padding:6px 8px;border-radius:6px;margin:6px 0"><b>These results are from a previous engine.</b> The engine was rebuilt since — press "Re-check engine quality" to refresh.</div>` : '';
  const staleS = p.second_opinion_stale ? `<div class="qq" style="background:#F6E7C1;padding:6px 8px;border-radius:6px;margin:6px 0"><b>From a previous engine</b> — press "Re-run the second opinion" to refresh.</div>` : '';
  const soHtml = so ? `<h3 style="margin-top:12px">Second opinion — two independent engines</h3>${staleS}` + so.map(c =>
    `<div class="qrow ${c.status}"><span class="qi">${icon(c.status)}</span>
     <span><b>${c.check}</b> — ${c.detail}${c.question?`<div class="qq">${c.question}</div>`:''}</span></div>`).join('')
    : (!p.builtin ? `<p class="status"><button class="btn" style="padding:6px 10px;font-size:13px" onclick="runSecond('${p.id}', this)">Get a second opinion (generates a second engine, ~$0.20)</button></p>` : '');
  el.innerHTML = `<div class="qual"><h3>Engine correctness <button class="btn${p.quality_stale?' amber':''}" style="padding:3px 9px;font-size:12px;margin-left:8px" onclick="runQuality('${p.id}', this)">Re-check engine quality (free)</button>${(q||[]).some(c=>/invariant/.test(c.check)&&c.status==='flag') && !p.builtin ? ` <button class="btn amber" style="padding:3px 9px;font-size:12px" onclick="stageJob('${p.id}','/fix-invariant','Fixing the invariant failure', this)">Fix the engine from this failure (~$0.60)</button>`:''}</h3>${staleQ}` + q.map(c =>
    `<div class="qrow ${c.status}"><span class="qi">${icon(c.status)}</span>
     <span><b>${c.check}</b> — ${c.detail}${c.question?`<div class="qq">${c.question}</div>`:''}</span></div>`
  ).join('') + soHtml + `<p class="status"><button class="btn" style="padding:6px 10px;font-size:13px" onclick="runQuality('${p.id}', this)">Re-run the second opinion (~$0.50, builds a fresh second engine)</button></p></div>`;
}
async function runSecond(id, btn){ await fromButton(btn, 'Second opinion', ()=>api('/projects/'+id+'/second-opinion', {})); }
async function runQuality(id, btn){ await fromButton(btn, 'Checking', ()=>api('/projects/'+id+'/quality', {})); }

async function generate(id, force, btn){
  const st = $('#engstat');
  if(btn) btn.disabled = true;
  try{
    const job = await api('/projects/'+id+'/generate'+(force?'?force=true':''), {});
    await watch(job.id, st, 'Building the engine');
    open(id);
  }catch(e){ st.className='status err'; st.textContent=e.message; if(btn) btn.disabled=false;
    if(!force && /readiness|workshop first/.test(e.message)){
      const b=document.createElement('button'); b.className='btn'; b.style.cssText='margin-left:8px;padding:4px 8px;font-size:12px';
      b.textContent='Build anyway (the engine will guess)'; b.onclick=()=>generate(id,true); st.appendChild(b); }
    if(e.trace){ const pre=document.createElement('pre');
      pre.style.cssText='font-size:12px;white-space:pre-wrap;color:var(--ink-soft)';
      pre.textContent=e.trace.split('\n').slice(-12).join('\n'); st.appendChild(pre); } }
}

async function runSim(id, btn){
  const st = $('#simstat');
  if(btn) btn.disabled = true; notifyAsk();
  try{
    const job = await api('/projects/'+id+'/simulate', {
      games:+$('#g').value, players:+$('#pl').value, agents:agentsString(),
      rotate:$('#rot').checked});
    await watch(job.id, st, 'Running');
    st.className='status ok'; st.textContent='Done.'; notify('Simulation finished', 'The balance report is ready.');
    loadReport(id);
  }catch(e){ st.className='status err'; st.textContent=e.message; }
  finally{ if(btn) btn.disabled = false; }
}

async function deleteProject(id, name){
  if(!confirm(`Delete "${name}" and everything in it — rulebook, engine, versions, reports? This can't be undone.`)) return;
  try{ await api('/projects/'+id, null, 'DELETE'); current=null; refresh(); }
  catch(e){ alert(e.message); }
}
async function showRunning(id){
  let jobs = [];
  try{ jobs = await api('/projects/'+id+'/jobs'); }catch(e){ return; }
  const el = $('#running'); if(!el) return;
  if(!jobs.length){ el.innerHTML=''; BUSY=false; return; }
  BUSY = true;
  document.querySelectorAll('#main .btn:not(.keep)').forEach(b=>{ if(!/Stop|Delete/.test(b.textContent)) b.disabled=true; });
  const j = jobs[0];
  if(j.paused){ el.innerHTML = pausedHtml(j); if(!PAUSE_NOTIFIED[j.id]){ PAUSE_NOTIFIED[j.id]=1; notify('Run paused at $'+j.paused.spent.toFixed(2), 'It reached its spending cap — continue or stop.'); }
    setTimeout(()=>{ if(current===id) showRunning(id); }, 2000); return; }
  el.innerHTML = `<div class="stage" style="border-left:4px solid var(--token)"><span class="spin"></span><b>${esc(j.kind.replace(/_/g,' '))}</b> is running — ${esc(j.detail||'working')}${j.progress?` <i style="opacity:.75">(${esc(j.progress)})</i>`:''} <span style="opacity:.6">(${Math.floor(j.elapsed/60)}m ${Math.floor(j.elapsed%60)}s${j.spent_usd?` · $${j.spent_usd.toFixed(2)} so far`:''}${j.cap_usd?`, stops at $${j.cap_usd.toFixed(2)}`:''})</span>
    ${DEV?` <button class="btn keep" style="padding:2px 8px;font-size:11px;background:var(--alert)" onclick="stopJob('${j.id}')">Stop</button>`:''}
    <div class="qq">You can leave this page; it will update when the run finishes.</div></div>`;
  setTimeout(async ()=>{ if(current!==id) return;
    let still=[]; try{ still = await api('/projects/'+id+'/jobs'); }catch(e){}
    if(still.length) showRunning(id); else { notify(j.kind.replace(/_/g,' ') + ' finished', 'Open bgsim to see the result.'); open(id); } }, 2000);
}
async function stopJob(jid){ try{ await api('/jobs/'+jid+'/cancel', {}); }catch(e){ alert(e.message); } }
function pausedHtml(j){
  const p = j.paused;
  return `<div class="stage" style="border-left:4px solid var(--alert);margin:6px 0"><b>Paused at $${p.spent.toFixed(2)}</b> — this run has reached its cap. It's taking more than estimated, which can be legitimate (a hard fix, lots of thinking) or a runaway. Everything done so far is kept.
    <div class="resolve"><button class="btn amber" onclick="continueJob('${j.id}')">Continue, up to $${p.offer.toFixed(2)}</button> <button class="btn" style="background:var(--alert)" onclick="stopJob('${j.id}')">Stop here</button></div></div>`;
}
let PAUSE_NOTIFIED = {};
async function continueJob(jid){ try{ await api('/jobs/'+jid+'/continue', {}); }catch(e){ alert(e.message); } }
async function watch(jid, el, verb){
  for(;;){
    const j = await api('/jobs/'+jid);
    if(j.status==='running' && j.paused){
      el.className='status'; el.innerHTML = pausedHtml(j);
      if(!PAUSE_NOTIFIED[jid]){ PAUSE_NOTIFIED[jid]=1; notify(verb+' paused at $'+j.paused.spent.toFixed(2), 'It reached its spending cap — continue or stop.'); }
    } else if(j.status==='running'){
      el.className='status';
      el.innerHTML = `<span class="spin"></span>${verb}… ${j.detail||''}${j.progress?` <i style="opacity:.75">(${esc(j.progress)})</i>`:''} <span style="opacity:.6">(${Math.floor((j.elapsed||0)/60)}m ${Math.floor((j.elapsed||0)%60)}s${j.spent_usd?` · $${j.spent_usd.toFixed(2)} so far`:''}${j.cap_usd?`, stops at $${j.cap_usd.toFixed(2)}`:''})</span>`
        + (DEV ? ` <button class="btn" style="padding:2px 8px;font-size:11px;background:var(--alert)" onclick="stopJob('${jid}')">Stop</button>` : '');
      await new Promise(r=>setTimeout(r, 900));
    } else if(j.status==='cancelled'){ throw new Error('Stopped.');
    } else if(j.status==='error'){
      const err = new Error(j.error); err.trace = j.trace; throw err;
    } else return j;
  }
}

async function loadReport(id){
  try{
    const r = await api('/projects/'+id+'/report');
    $('#pad').innerHTML = md(r.markdown);
  }catch(e){ /* no report yet */ }
}

/* minimal markdown: headers, tables, lists, italics line */
function md(src){
  const esc = s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const lines = src.split('\n'); let out=[], table=[];
  const flush=()=>{ if(!table.length) return;
    const rows = table.filter(r=>!/^\|[\s:-]+\|/.test(r))
      .map(r=>r.replace(/^\||\|$/g,'').split('|').map(c=>esc(c.trim())));
    const [h,...body]=rows;
    out.push('<table><tr>'+h.map(c=>`<th>${c}</th>`).join('')+'</tr>'+
      body.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')+'</table>');
    table=[]; };
  for(const L of lines){
    if(/^\|/.test(L)){ table.push(L); continue; } flush();
    if(/^### /.test(L)) out.push(`<h3>${esc(L.slice(4))}</h3>`);
    else if(/^## /.test(L)) out.push(`<h3>${esc(L.slice(3))}</h3>`);
    else if(/^# /.test(L)) out.push(`<h2>${esc(L.slice(2))}</h2>`);
    else if(/^- /.test(L)) out.push(`<ul><li>${esc(L.slice(2))}</li></ul>`);
    else if(/^_.*_$/.test(L.trim())) out.push(`<p class="meta">${esc(L.trim().slice(1,-1))}</p>`);
    else if(L.trim()) out.push(`<p>${esc(L)}</p>`);
  }
  flush();
  return out.join('').replace(/<\/ul><ul>/g,'');
}

refresh();
