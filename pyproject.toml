[project]
name = "bgsim"
version = "0.1.0"
description = "Board game balance simulator — MVP validated on Splendor"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
web = ["fastapi", "uvicorn"]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["bgsim"]
